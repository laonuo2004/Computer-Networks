<svg xmlns="http://www.w3.org/2000/svg" width="930" height="500" viewBox="0 0 930 500">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #111; }
      .label { font-size: 13px; }
      .small { font-size: 12px; }
      .life { stroke: #555; stroke-width: 1.4; stroke-dasharray: 5 5; }
      .msg { stroke: #333; stroke-width: 1.5; marker-end: url(#arrow); }
      .lost { stroke: #cc3333; stroke-width: 1.6; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .ack { stroke: #2f80ed; stroke-width: 1.5; marker-end: url(#arrow); }
      .note { fill: #fff8e8; stroke: #c58b24; rx: 5; }
    </style>
  </defs>
  <text x="120" y="32" text-anchor="middle" class="label">Sender</text>
  <text x="810" y="32" text-anchor="middle" class="label">Receiver</text>
  <line x1="120" y1="55" x2="120" y2="460" class="life"/>
  <line x1="810" y1="55" x2="810" y2="460" class="life"/>

  <line x1="120" y1="80" x2="810" y2="105" class="msg"/>
  <text x="430" y="82" class="small">DATA seq=1</text>
  <line x1="810" y1="125" x2="120" y2="150" class="ack"/>
  <text x="600" y="123" class="small">ACK 1</text>

  <line x1="120" y1="170" x2="560" y2="195" class="lost"/>
  <text x="350" y="170" class="small">DATA seq=2 lost/corrupted</text>
  <text x="585" y="198" class="small" fill="#cc3333">X</text>

  <line x1="120" y1="220" x2="810" y2="245" class="msg"/>
  <text x="430" y="220" class="small">DATA seq=3</text>
  <line x1="810" y1="265" x2="120" y2="290" class="ack"/>
  <text x="565" y="263" class="small">duplicate ACK 1</text>

  <line x1="120" y1="305" x2="810" y2="330" class="msg"/>
  <text x="430" y="305" class="small">DATA seq=4</text>
  <line x1="810" y1="350" x2="120" y2="375" class="ack"/>
  <text x="565" y="348" class="small">duplicate ACK 1</text>

  <rect x="45" y="395" width="150" height="38" class="note"/>
  <text x="120" y="419" text-anchor="middle" class="small">sender timeout</text>

  <line x1="120" y1="440" x2="810" y2="465" class="msg"/>
  <text x="385" y="440" class="small">retransmit DATA seq=2,3,4</text>

  <rect x="610" y="185" width="230" height="48" class="note"/>
  <text x="725" y="204" text-anchor="middle" class="small">Receiver still expects seq=2.</text>
  <text x="725" y="221" text-anchor="middle" class="small">Later DATA is discarded.</text>
</svg>
