<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3a506b"/></marker>
    <style>
      .box{fill:#f7f9fc;stroke:#3a506b;stroke-width:2;rx:12}.accent{fill:#e9f2ff}.store{fill:#fff7e6}.txt{font:20px 'Times New Roman',serif;fill:#172238}.small{font:16px 'Times New Roman',serif;fill:#33415c}.line{fill:none;stroke:#3a506b;stroke-width:2.4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="box accent" x="35" y="225" width="150" height="80"/>
  <text class="txt" x="110" y="258" text-anchor="middle">Web clients</text><text class="small" x="110" y="284" text-anchor="middle">browser / curl</text>
  <rect class="box" x="240" y="70" width="190" height="80"/>
  <text class="txt" x="335" y="102" text-anchor="middle">Listener thread</text><text class="small" x="335" y="128" text-anchor="middle">TCP port 8888</text>
  <rect class="box" x="240" y="225" width="190" height="80"/>
  <text class="txt" x="335" y="257" text-anchor="middle">Connection manager</text><text class="small" x="335" y="283" text-anchor="middle">limit and FIFO queue</text>
  <rect class="box accent" x="500" y="225" width="190" height="80"/>
  <text class="txt" x="595" y="257" text-anchor="middle">Fixed worker pool</text><text class="small" x="595" y="283" text-anchor="middle">1--20 threads</text>
  <rect class="box" x="760" y="225" width="200" height="80"/>
  <text class="txt" x="860" y="257" text-anchor="middle">HTTP application</text><text class="small" x="860" y="283" text-anchor="middle">parse, route, respond</text>
  <rect class="box store" x="725" y="390" width="200" height="75"/>
  <text class="txt" x="825" y="422" text-anchor="middle">Static resources</text><text class="small" x="825" y="447" text-anchor="middle">HTML, CSS, SVG</text>
  <rect class="box store" x="505" y="500" width="200" height="75"/>
  <text class="txt" x="605" y="532" text-anchor="middle">CGI subprocess</text><text class="small" x="605" y="557" text-anchor="middle">calculator / query</text>
  <rect class="box store" x="285" y="500" width="160" height="75"/>
  <text class="txt" x="365" y="532" text-anchor="middle">SQLite</text><text class="small" x="365" y="557" text-anchor="middle">students.db</text>
  <rect class="box store" x="765" y="70" width="190" height="75"/>
  <text class="txt" x="860" y="102" text-anchor="middle">Access log</text><text class="small" x="860" y="127" text-anchor="middle">one line per request</text>
  <path class="line" d="M110 225 V190 H205 V110 H240"/><path class="line" d="M335 150 V225"/><path class="line" d="M430 265 H500"/><path class="line" d="M690 265 H760"/>
  <path class="line" d="M860 305 V390"/><path class="line" d="M790 305 V350 H605 V500"/><path class="line" d="M505 538 H445"/><path class="line" d="M860 225 V145"/>
</svg>
